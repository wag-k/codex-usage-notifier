name: Windows Release Artifact

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version (MAJOR.MINOR.PATCH)
        required: true
        type: string

permissions:
  contents: read

jobs:
  release-build:
    runs-on: windows-latest
    env:
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 8.0.x

      - name: Validate release input
        shell: pwsh
        run: |
          if ($env:RELEASE_VERSION -notmatch '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$') {
            throw 'versionはMAJOR.MINOR.PATCH形式で指定してください。'
          }

      - name: Restore locked dependencies
        run: dotnet restore CodexUsageNotifier.sln --locked-mode

      - name: Build Release
        shell: pwsh
        run: |
          $informationalVersion = "$env:RELEASE_VERSION+$($env:GITHUB_SHA.Substring(0, 7))"
          dotnet build CodexUsageNotifier.sln -c Release --no-restore -warnaserror "-p:Version=$env:RELEASE_VERSION" "-p:InformationalVersion=$informationalVersion" -p:IncludeSourceRevisionInInformationalVersion=false

      - name: Test Release
        run: dotnet test CodexUsageNotifier.sln -c Release --no-build --logger "trx;LogFileName=test-results.trx" --results-directory artifacts/test-results

      - name: Check NuGet vulnerabilities
        shell: pwsh
        run: ./eng/Test-NuGetVulnerabilities.ps1

      - name: Restore win-x64 publish dependencies
        run: dotnet restore src/CodexUsageNotifier/CodexUsageNotifier.csproj -r win-x64 --locked-mode

      - name: Publish win-x64 self-contained
        shell: pwsh
        run: |
          $informationalVersion = "$env:RELEASE_VERSION+$($env:GITHUB_SHA.Substring(0, 7))"
          dotnet publish src/CodexUsageNotifier/CodexUsageNotifier.csproj `
            -c Release -r win-x64 --self-contained true --no-restore `
            -p:PublishTrimmed=false -p:PublishSingleFile=false `
            -p:DebugType=None -p:DebugSymbols=false `
            -p:IncludeSourceRevisionInInformationalVersion=false `
            "-p:Version=$env:RELEASE_VERSION" `
            "-p:InformationalVersion=$informationalVersion" `
            -o artifacts/publish/win-x64

      - name: Package and verify Release artifact
        shell: pwsh
        run: ./eng/New-ReleaseArtifact.ps1 -Version $env:RELEASE_VERSION -PublishDirectory artifacts/publish/win-x64 -ReleaseDirectory artifacts/release

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-test-results-windows
          path: artifacts/test-results/**/*.trx
          if-no-files-found: error
          retention-days: 14

      - name: Upload Release ZIP and SHA-256
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: CodexUsageNotifier-v${{ inputs.version }}-win-x64
          path: artifacts/release/*
          if-no-files-found: error
          retention-days: 14
