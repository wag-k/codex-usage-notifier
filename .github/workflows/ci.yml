name: Windows CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 8.0.x

      - name: Restore locked dependencies
        run: dotnet restore CodexUsageNotifier.sln --locked-mode

      - name: Audit third-party licenses
        shell: pwsh
        run: ./eng/Audit-Licenses.ps1

      - name: Build Release
        run: dotnet build CodexUsageNotifier.sln -c Release --no-restore -warnaserror

      - name: Test Release
        run: dotnet test CodexUsageNotifier.sln -c Release --no-build --logger "trx;LogFileName=test-results.trx" --results-directory artifacts/test-results

      - name: Check NuGet vulnerabilities
        shell: pwsh
        run: ./eng/Test-NuGetVulnerabilities.ps1

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results-windows
          path: artifacts/test-results/**/*.trx
          if-no-files-found: error
          retention-days: 14
